<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { 
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
        background-image: url('https://googleusercontent.com'); 
        background-color: #000000; 
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        display: flex; justify-content: center; align-items: center; min-height: 98vh; margin: 0;
      }
      .login-box {
        width: 360px; margin: 7% auto; background: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); box-sizing: border-box;
      }
      .login-logo {
        font-size: 35px; text-align: center; margin-bottom: 25px; font-weight: 700; color: #f4c430; 
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      }
      .login-logo b { font-weight: 700; }
      .login-box-msg { margin: 0; text-align: center; padding: 0 20px 20px 20px; color: #666; font-size: 14px; }
      .form-group { position: relative; margin-bottom: 15px; }
      .form-group input, .form-group select, .form-group textarea {
        width: 100%; height: 34px; padding: 6px 12px; font-size: 14px; line-height: 1.42857143; color: #555; background-color: #fff; border: 1px solid #ccc; box-sizing: border-box; transition: border-color ease-in-out .15s,box-shadow ease-in-out .15s;
      }
      .form-group textarea { height: auto; }
      .form-group .glyphicon {
        position: absolute; top: 10px; right: 12px; font-size: 14px; color: #777;
      }
      .btn-primary {
        background-color: #f4c430; border-color: #e0b324; color: #000; display: block; width: 100%; height: 36px; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: background 0.2s;
      }
      .btn-primary:hover { background-color: #e0b324; border-color: #c9a01b; }
      .btn-primary:disabled { background-color: #aab2bd; cursor: not-allowed; color: #fff; }
      #loginMsg, #msg { margin-top: 15px; padding: 8px; text-align: center; font-size: 13px; font-weight: bold; border-radius: 3px; }
      .error { color: #a94442; background-color: #f2dede; border: 1px solid #ebccd1; }
      .loading { color: #8a6d3b; background-color: #fcf8e3; border: 1px solid #faebcc; }
      .success { color: #3c763d; background-color: #dff0d8; border: 1px solid #d6e9c6; }
      
      .portal-box { width: 440px; background: #fff; padding: 30px; border-radius: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); box-sizing: border-box; }
      .portal-box h3 { margin-top: 0; margin-bottom: 20px; color: #222; text-align: center; border-bottom: 3px solid #f4c430; padding-bottom: 10px; font-size: 20px; }
      .portal-box label { font-weight: bold; display: block; margin-bottom: 5px; color: #444; font-size: 13px; }
    </style>
  </head>
  <body>

    <!-- 1. LOGIN SCREEN INTERFACE -->
    <div id="loginWrapper">
      <div class="login-logo"><b>RUSI EDP</b> Ticketing System</div>
      <div class="login-box">
        <p class="login-box-msg">Sign in to start your session</p>
        <div class="form-group">
          <input type="text" id="loginUser" placeholder="Username" required>
          <span class="glyphicon">👤</span>
        </div>
        <div class="form-group">
          <input type="password" id="loginPass" placeholder="Password" required>
          <span class="glyphicon">🔒</span>
        </div>
        <button id="btnLogin" class="btn-primary" onclick="handleLogin()">Log In</button>
        <div id="loginMsg" style="display: none;"></div>
      </div>
    </div>

    <!-- 2. SUPPORT TICKET PORTAL -->
    <div id="portalWrapper" class="portal-box" style="display: none;">
      <h3>🎫 Customer Support Portal</h3>
      <div class="form-group"><label>Gmail Address</label><input type="email" id="userEmail" placeholder="e.g. name@gmail.com" required></div>
      <div class="form-group"><label>Contact Number</label><input type="tel" id="userPhone" placeholder="e.g. 09123456789" required></div>
      <div class="form-group"><label>Branch / Outlet</label><input type="text" id="branch" placeholder="e.g. meycauyan branch" required></div>
      <div class="form-group"><label>Subject / Issue</label><textarea id="subject" rows="3" placeholder="Describe the problem..." required></textarea></div>
      <div class="form-group"><label>Assigned To</label>
        <select id="assigned">
          <option value="" disabled selected hidden>Select Technician</option>
          <option value="JM - EDP MEYCAUYAN">JM - EDP MEYCAUYAN</option>
          <option value="RAFFY - EDP MEYCAUYAN">RAFFY - EDP MEYCAUYAN</option>
          <option value="KING - EDP MEYCAUYAN">KING - EDP MEYCAUYAN</option>
          <option value="KENNETH - EDP SAN MANUEL BODEGA">KENNETH - EDP SAN MANUEL BODEGA</option>
          <option value="JN CLAUDE - EDP SAN MANUEL BODEGA">JN CLAUDE - EDP SAN MANUEL BODEGA</option>
          <option value="REX - EDP STO.TOMAS BRANCH">REX - EDP STO.TOMAS BRANCH</option>
          <option value="Support Team EDP DUMAGUETE">Support Team EDP DUMAGUETE</option>
        </select>
      </div>
      <div class="form-group"><label>Priority</label>
        <select id="priority">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
      </div>
      <button id="btnSubmit" class="btn-primary" onclick="submitForm()">I-SUBMIT TICKET</button>
      <div id="msg" style="display: none;"></div>
    </div>

    <script>
      // 🚨 MAHALAGA: PALITAN MO ITO NG IYONG WEB APP URL MATAPOS MO I-DEPLOY SA APPS SCRIPT
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwKaBVNIkWEkjIi8vssQQOPUAXjTKxU4MNEaDXQZP8eqm83ULCkDYwk_Z8LbtCHm2ZrKQ/exec";

      function handleLogin() {
        var user = document.getElementById('loginUser').value.trim();
        var pass = document.getElementById('loginPass').value.trim();
        var loginMsg = document.getElementById('loginMsg');
        var btnLogin = document.getElementById('btnLogin');
        
        loginMsg.style.display = "block";
        if(!user || !pass) {
          loginMsg.className = "error"; loginMsg.innerText = "⚠️ Paki-sagutan ang Username at Password!"; return;
        }
        
        btnLogin.disabled = true; loginMsg.className = "loading"; loginMsg.innerText = "⏳ Verifying session...";
        
        var loginUrl = WEB_APP_URL + "?action=login&username=" + encodeURIComponent(user) + "&password=" + encodeURIComponent(pass);

        fetch(loginUrl, { method: "POST" })
        .then(response => response.json())
        .then(res => {
          btnLogin.disabled = false;
          if(res.success) {
            document.getElementById('loginWrapper').style.display = 'none';
            document.getElementById('portalWrapper').style.display = 'block';
          } else {
            loginMsg.className = "error"; loginMsg.innerText = res.message;
          }
        })
        .catch(err => {
          btnLogin.disabled = false; 
          loginMsg.className = "error"; loginMsg.innerText = "❌ Error: " + err.message;
        });
      }

      function submitForm() {
        var userEmail = document.getElementById('userEmail').value.trim();
        var userPhone = document.getElementById('userPhone').value.trim();
        var branch = document.getElementById('branch').value.trim();
        var subject = document.getElementById('subject').value.trim();
        var assigned = document.getElementById('assigned').value;
        var priority = document.getElementById('priority').value;
        var msgDiv = document.getElementById('msg'); 
        var btn = document.getElementById('btnSubmit');
        
        msgDiv.style.display = "block";
        if(!userEmail || !userPhone || !branch || !subject || !assigned) {
          msgDiv.className = "error"; msgDiv.innerText = "⚠️ Paki-sagutan ang lahat ng impormasyon!"; return;
        }
        
        btn.disabled = true; msgDiv.className = "loading"; msgDiv.innerText = "⏳ Isinusumite ang ticket sa system...";
        
        var postUrl = WEB_APP_URL + "?action=saveTicket" +
                      "&branch=" + encodeURIComponent(branch) +
                      "&subject=" + encodeURIComponent(subject) +
                      "&assigned=" + encodeURIComponent(assigned) +
                      "&priority=" + encodeURIComponent(priority) +
                      "&userEmail=" + encodeURIComponent(userEmail) +
                      "&userPhone=" + encodeURIComponent(userPhone);

        fetch(postUrl, { method: "POST" })
        .then(response => response.json())
        .then(res => {
          btn.disabled = false;
          if (res.success) {
             msgDiv.className = "success";
             msgDiv.innerText = res.message;
             
             document.getElementById('userEmail').value = "";
             document.getElementById('userPhone').value = "";
             document.getElementById('branch').value = "";
             document.getElementById('subject').value = "";
             document.getElementById('assigned').value = "";
          } else {
             msgDiv.className = "error"; 
             msgDiv.innerText = res.message || "❌ Nagka-error sa pagsusumite.";
          }
        })
        .catch(err => {
          btn.disabled = false;
          msgDiv.className = "error";
          msgDiv.innerText = "❌ Nagka-error sa server: " + err.message;
        });
      }
    </script>
  </body>
</html>
